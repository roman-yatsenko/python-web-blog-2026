{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock  %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <p>
        <i>📅 {{ post.publish }} 👤 {{ post.author }}</i>
    </p>
    {{ post.body|linebreaks }}
    <p>
        <a href="{% url 'blog:post_share' post.id %}"><b>Пошарити пост</b></a>
    </p>
{% endblock content %}
