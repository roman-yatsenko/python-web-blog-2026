{% load blog_tags %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock  %}</title>
    <link rel="stylesheet" href="https://unpkg.com/mvp.css">
</head>
<body>
    <header>
        <nav>
            <a href="/"><img alt="Logo" src="https://via.placeholder.com/200x70?text=Logo" height="70"></a>
            <ul>
                <li><a href="#">Останні пости</a>
                    {% show_latest_posts 3 %}
                </li>
            </ul>
        </nav>
        <h1>Мій блог</h1>
    </header>
    <main>
        <hr>
        {% block content %}
        {% endblock  %}
    </main>
    <footer>
        <hr>
        <p>
            <small>Загальна кількість постів - {% total_posts %}</small><br>
            <small>&copy; 2026</small></p>
    </footer>
</body>
</html>
